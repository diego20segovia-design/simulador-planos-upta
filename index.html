},{id:`doble`,nombre:`Doble`},{id:`corrediza`,nombre:`Corrediza`},{id:`porton`,nombre:`Portón`}],variantesVentana:[{id:`fija`,nombre:`Fija`},{id:`corrediza`,nombre:`Corrediza`},{id:`panoramica`,nombre:`Panorámica`}],normasReferencia:[{icono:`🚪`,categoria:`arquitectura`,titulo:`Puertas y circulación`,items:[`No ubicar tomacorrientes ni interruptores sobre la hoja ni dentro del área de giro de una puerta.`,`Dejar como mínimo 0.20 m entre el mecanismo y el marco de la puerta.`,`El interruptor se instala del lado de la manija, a 1.10–1.20 m del piso y a menos de 1.20 m del marco.`,`Ancho de puerta de paso: 0.70–1.20 m. En baños se admite un mínimo de 0.70 m.`,`Las puertas dobles y corredizas deben dejar un paso libre equivalente al menos al ancho nominal de una hoja.`]},{icono:`🪟`,categoria:`arquitectura`,titulo:`Ventanas y ventilación`,items:[`Toda habitación debe tener ventilación e iluminación natural; la ventana no debe quedar bloqueada por mobiliario fijo.`,`No colocar tomacorrientes ni mecanismos sobre el vano de la ventana.`,`Ventanas panorámicas: verificar que el peso se transmita correctamente al dintel y a los jambajes.`,`La suma de áreas de ventilación debe ser al menos el 10 % del área del ambiente.`]},{icono:`🏛️`,categoria:`arquitectura`,titulo:`Estructura, columnas y escaleras`,items:[`Las columnas se ubican en intersecciones de muros o puntos de carga y no deben quedar dentro de puertas ni circulaciones.`,`Mantener una separación mínima de 0.30 m entre columnas y vanos para evitar concentración de esfuerzos.`,`El ancho libre de escalera residencial debe ser de 0.80–0.90 m como mínimo.`,`Cada tramo de escalera requiere descanso y baranda; la huella recomendada es 0.28–0.30 m y la contrahuella 0.17–0.18 m.`]},{icono:`♿`,categoria:`arquitectura`,titulo:`Accesibilidad y circulación`,items:[`Pasillos y circulaciones principales: 0.90 m mínimo libre; se recomienda 1.20 m para sillas de ruedas.`,`Las puertas de acceso principal deben abrir hacia el exterior o no obstruir la ruta de escape.`,`Evitar desniveles sin rampa en accesos; la pendiente máxima recomendada es 8 %.`,`Los ambientes no deben quedar sin acceso directo desde una circulación.`]},{icono:`🔌`,categoria:`electrica`,titulo:`Tomacorrientes`,items:[`Altura general: 0.30–0.40 m sobre el piso; sobre mesada: 1.10–1.20 m; aire acondicionado: 2.00–2.50 m.`,`Separación recomendada entre tomas: 1.50 m, para cubrir la pared con cables de 1.80 m sin extensiones.`,`No instalar tomas sobre ventanas, detrás de puertas ni en el barrido de una puerta.`,`Las tomas deben quedar montadas sobre un muro o tabique, nunca “flotando” en el ambiente.`,`Toda toma debe ser polarizada; en cocina, baño y lavandería debe incluir puesta a tierra.`]},{icono:`💧`,categoria:`electrica`,titulo:`Zonas húmedas (baño, cocina y lavandería)`,items:[`Usar tomacorriente con puesta a tierra (3 polos) y protección diferencial de 30 mA.`,`Mantener las tomas a más de 1.20 m de la ducha, bañera o fregadero.`,`No instalar tomas simples dentro de baños ni sobre la mesada de cocina sin puesta a tierra.`,`Los interruptores deben ubicarse fuera de la zona húmeda, preferiblemente al exterior del baño.`]},{icono:`💡`,categoria:`electrica`,titulo:`Iluminación`,items:[`Cada ambiente habitable debe tener al menos un punto de luz.`,`Baños y cocinas requieren luminarias aptas para humedad (IP44 o superior).`,`Interruptores de escalera: usar interruptores de 2 vías o cruzados en ambos extremos.`,`La altura de los puntos de techo recomendada es 2.50–3.00 m.`,`Cada luminaria debe quedar controlada por al menos un interruptor y conectada al circuito.`]},{icono:`🛡️`,categoria:`electrica`,titulo:`Protección y tablero`,items:[`Todo circuito de tomacorrientes debe tener protección contra sobrecorriente y diferencial de 30 mA.`,`El tablero general se instala entre 1.40 y 1.80 m, accesible y con puerta de apertura hacia fuera.`,`La puesta a tierra debe ser continua y con resistencia máxima de 25 Ω.`,`No hacer empalmes dentro de paredes; usar cajas de paso o registro accesibles.`]},{icono:`⚡`,categoria:`electrica`,titulo:`Conductores y circuitos`,items:[`Todo circuito requiere conductor de fase y neutro; las tomas con tierra requieren conductor de protección (PE).`,`La capacidad del breaker debe ser menor o igual a la ampacidad del conductor que protege.`,`No conectar más de 8 tomas por circuito de 15 A; distribuir las cargas de cocina y lavandería en circuitos independientes.`,`Evitar empalmes sin caja de registro y conductores sin identificación de color.`,`El neutro y la tierra no deben unirse dentro de la instalación; la unión se hace solo en el tablero principal.`]},{icono:`📏`,categoria:`electrica`,titulo:`Distancias de seguridad`,items:[`Mínimo 0.40 m entre tubería eléctrica y tubería de gas; nunca cruzarlas.`,`Mínimo 2.5 cm entre conductores y superficies combustibles.`,`Línea aérea de acometida: mínimo 5.50 m sobre vía pública (hasta 7.50 m en vías vehiculares).`,`Caja de paso o registro: 0.15–0.30 m del piso cuando se instala en pared baja.`]}],mostrarConfirmarBorrar:!1,tiposComponentes:[{id:`fase_l1`,nombre:`Fase L1`,icono:`L1`,categoria:`Fuentes`,esConductor:!1,daEnergia:!0,resistenciaDefault:0,voltajeFuente:120,descripcion:`Alimentación de 120 V entre fase y neutro.`},{id:`fase_l2`,nombre:`Fase L2`,icono:`L2`,categoria:`Fuentes`,esConductor:!1,daEnergia:!0,resistenciaDefault:0,voltajeFuente:120,descripcion:`Segunda fase de alimentación de 120 V.`},{id:`fase_l3`,nombre:`Fase L3`,icono:`L3`,categoria:`Fuentes`,esConductor:!1,daEnergia:!0,resistenciaDefault:0,voltajeFuente:120,descripcion:`Tercera fase de alimentación de 120 V.`},{id:`neutro`,nombre:`Neutro`,icono:`N`,categoria:`Fuentes`,esConductor:!1,daEnergia:!0,resistenciaDefault:0,voltajeFuente:0,descripcion:`Conductor de retorno a 0 V. Cierra el circuito.`},{id:`tierra`,nombre:`Tierra (PE)`,icono:`⏚`,categoria:`Fuentes`,esConductor:!1,daEnergia:!0,resistenciaDefault:0,voltajeFuente:0,descripcion:`Conductor de protección (PE) co  es igual a la suma de corrientes que salen.</p><div class="ref-ley-ejemplo" data-v-118d37b5><strong data-v-118d37b5>Ejemplo:</strong> Si entran 3A y 2A, debe salir 5A. </div></div><div class="ref-ley-card" data-v-118d37b5><div class="ref-ley-header" data-v-118d37b5><h5 data-v-118d37b5>Ley de Voltajes de Kirchhoff (KVL)</h5><span class="ref-ley-formula" data-v-118d37b5>ΣV = 0</span></div><p data-v-118d37b5>La suma algebraica de todos los voltajes en una malla cerrada es igual a cero.</p><div class="ref-ley-ejemplo" data-v-118d37b5><strong data-v-118d37b5>Ejemplo:</strong> En una malla con fuente de 12V y dos caídas de 5V y 7V: +12 − 5 − 7 = 0 </div></div><div class="ref-ley-card" data-v-118d37b5><div class="ref-ley-header" data-v-118d37b5><h5 data-v-118d37b5>Ley de Joule</h5><span class="ref-ley-formula" data-v-118d37b5>Q = I² × R × t</span></div><p data-v-118d37b5>El calor (Q) generado en un conductor es proporcional al cuadrado de la corriente, la resistencia y el tiempo.</p><div class="ref-ley-ejemplo" data-v-118d37b5><strong data-v-118d37b5>Ejemplo:</strong> Un calentador con I=5A, R=20Ω durante 60s genera: Q = 25 × 20 × 60 = 30,000 J </div></div></div><div class="ref-trayecto" data-v-118d37b5><h4 class="ref-trayecto-title" data-v-118d37b5>Trayecto II - Leyes Avanzadas</h4><div class="ref-ley-card" data-v-118d37b5><div class="ref-ley-header" data-v-118d37b5><h5 data-v-118d37b5>Ley de Potencia Eléctrica</h5><span class="ref-ley-formula" data-v-118d37b5>P = V × I</span></div><p data-v-118d37b5>La potencia (P) es el producto del voltaje por la corriente. Se mide en Watts (W).</p><div class="ref-ley-desglose" data-v-118d37b5><span data-v-118d37b5>P = V × I</span><span data-v-118d37b5>P = I² × R</span><span data-v-118d37b5>P = V² / R</span></div></div><div class="ref-ley-card" data-v-118d37b5><div class="ref-ley-header" data-v-118d37b5><h5 data-v-118d37b5>Ley de Energía Eléctrica</h5><span class="ref-ley-formula" data-v-118d37b5>E = P × t</span></div><p data-v-118d37b5>La energía (E) es potencia por tiempo. Se mide en Watt-hora (Wh) o kilowatt-hora (kWh).</p><div class="ref-ley-ejemplo" data-v-118d37b5><strong data-v-118d37b5>Ejemplo:</strong> Un aparato de 100W encendido 5h consume: E = 100 × 5 = 500 Wh = 0.5 kWh </div></div><div class="ref-ley-card" data-v-118d37b5><div class="ref-ley-header" data-v-118d37b5><h5 data-v-118d37b5>Divisor de Voltaje</h5><span class="ref-ley-formula" data-v-118d37b5>V<sub data-v-118d37b5>x</sub> = V<sub data-v-118d37b5>total</sub> × (R<sub data-v-118d37b5>x</sub> / R<sub data-v-118d37b5>total</sub>)</span></div><p data-v-118d37b5>Permite calcular el voltaje en una resistencia específica dentro de un circuito en serie.</p></div><div class="ref-ley-card" data-v-118d37b5><div class="ref-ley-header" data-v-118d37b5><h5 data-v-118d37b5>Divisor de Corriente</h5><span class="ref-ley-formula" data-v-118d37b5>I<sub data-v-118d37b5>x</sub> = I<sub data-v-118d37b5>total</sub> × (R<sub data-v-118d37b5>total</sub> / R<sub data-v-118d37b5>x</sub>)</span></div><p data-v-118d37b5>Permite calcular la corriente que pasa por una resistencia específica en un circuito en paralelo.</p></div></div>`,2)]])):V(``,!0),i.tabReferencias===`componentes`?(P(),F(`div`,ky,[...t[269]||=[B(`<div class="ref-trayecto" data-v-118d37b5><h4 class="ref-trayecto-title" data-v-118d37b5>Trayecto I - Componentes Activos y Pasivos</h4><div class="ref-comp-card" data-v-118d37b5><h5 data-v-118d37b5>Resistencia (R)</h5><p data-v-118d37b5>Se opone al paso de la corriente. Se mide en Ohmios (Ω).</p><div class="ref-comp-datos" data-v-118d37b5><span data-v-118d37b5>Símbolo: ⌇ (zigzag)</span><span data-v-118d37b5>Ley: V = I × R</span><span data-v-118d37b5>Color en código: Banda de colores</span></div><div class="ref-comp-nota" data-v-118d37b5><strong data-v-118d37b5>Código de colores:</strong> Negro(0), Marrón(1), Rojo(2), Naranja(3), Amarillo(4), Verde(5), Azul(6), Violeta(7), Gris(8), Blanco(9) </div></div><div class="ref-comp-card" data-v-118d37b5><h5 data-v-118d37b5>Fusible</h5><p data-v-118d37b5>Protege el circuito contra sobrecorrientes. Se funde y abre el circuito.</p><div class="ref-comp-datos" data-v-118d37b5><span data-v-118d37b5>Símbolo: □ con línea</span><span data-v-118d37b5>Tipos: Lento, rápido, ultra-rápido</span><span data-v-118d37b5>Selección: debe ser ≥ 1.25× la corriente nominal</span></div></div><div class="ref-comp-card" data-v-118d37b5><h5 data-v-118d37b5>Lámpara Incandescente</h5><p data-v-118d37b5>Convierte energía eléctrica en luz y calor. Tiene resistencia variable.</p><div class="ref-comp-datos" data-v-118d37b5><span data-v-118d37b5>Tipo: Resistencia no lineal</span><span data-v-118d37b5>Potencia típica: 40W, 60W, 100W</span><span data-v-118d37b5>Voltaje: 110V o 220V</span></div></div></div><div class="ref-trayecto" data-v-118d37b5><h4 class="ref-trayecto-title" data-v-118d37b5>Trayecto II - Componentes Electrónicos</h4><div class="ref-comp-card" data-v-118d37b5><h5 data-v-118d37b5>Capacitor</h5><p data-v-118d37b5>Almacena energía en campo eléctrico. Se mide en Faradios (F).</p><div class="ref-comp-datos" data-v-118d37b5><span data-v-118d37b5>Fórmula: Q = C × V</span><span data-v-118d37b5>Energía: E = ½CV²</span><span data-v-118d37b5>En CC: circuito abierto | En CA: impedeancia Xc = 1/(2πfC)</span></div></div><div class="ref-comp-card" data-v-118d37b5><h5 data-v-118d37b5>Inductor (Bobina)</h5><p data-v-118d37b5>Almacena energía en campo magnético. Se mide en Henrios (H).</p><div class="ref-comp-datos" data-v-118d37b5><span data-v-118d37b5>Voltaje: V = L × (dI/dt)</span><span data-v-118d37b5>Energía: E = ½LI²</span><span data-v-118d37b5>Impedancia: Xl = 2πfL</span></div></div><div class="ref-comp-card" data-v-118d37b5><h5 data-v-118d37b5>Transformador</h5><p data-v-118d37b5>Eleva o reduce voltaje AC usando inducción electromagnética.</p><div class="ref-comp-datos" data-v-118d37b5><span data-v-118d37b5>Relación: V₁/V₂ = N₁/N₂</span><span data-v-118d37b5>Potencia: P₁ = P₂ (ideal)</span><span data-v-118d37b5>Tipos: Elevador, reductor, auto-transformador</span></div></div><div class="ref-comp-card" data-v-118d37b5><h5 data-v-118d37b5>Diodo</h5><p data-v-118d37b5>Permite el paso de corriente en una sola dirección.</p><div class="ref-comp-datos" data-v-118d37b5><span data-v-118d37b5>Conducción: Anodo → Cátodo</span><span data-v-118d37b5>Voltaje directo: ~0.7V (silicio), ~0.3V (germanio)</span><span data-v-118d37b5>Tipos: Rectificador, Zener, LED, Fotodiodo</span></div></div><div class="ref-comp-card" data-v-118d37b5><h5 data-v-118d37b5>Transistor</h5><p data-v-118d37b5>Amplifica o conmuta señales eléctricas. Base de la electrónica moderna.</p><div class="ref-comp-datos" data-v-118d37b5><span data-v-118d37b5>Tipos: BJT (NPN, PNP), MOSFET, JFET</span><span data-v-118d37b5>BJT: Emisor, Base, Colector</span><span data-v-118d37b5>Ganancia: β = Ic / Ib</span></div></div></div>`,2)]])):V(``,!0),i.tabReferencias===`unidades`?(P(),F(`div`,Ay,[...t[270]||=[B(`<div class="ref-trayecto" data-v-118d37b5><h4 class="ref-trayecto-title" data-v-118d37b5>Trayecto I - Unidades Eléctricas</h4><div class="ref-unidades-grid" data-v-118d37b5><div class="ref-unidad-card" data-v-118d37b5><div class="ref-unidad-simbolo" data-v-118d37b5>V</div><div class="ref-unidad-info" data-v-118d37b5><strong data-v-118d37b5>Voltaje</strong><span data-v-118d37b5>Unidad: Voltio (V)</span><span data-v-118d37b5>Fórmula: V = W/A</span><span data-v-118d37b5>Mide: Diferencia de potencial</span></div></div><div class="ref-unidad-card" data-v-118d37b5><div class="ref-unidad-simbolo" data-v-118d37b5>I</div><div class="ref-unidad-info" data-v-118d37b5><strong data-v-118d37b5>Corriente</strong><span data-v-118d37b5>Unidad: Amperio (A)</span><span data-v-118d37b5>Fórmula: I = V/R</span><span data-v-118d37b5>Mide: Flujo de electrones</span></div></div><div class="ref-unidad-card" data-v-118d37b5><div class="ref-unidad-simbolo" data-v-118d37b5>R</div><div class="ref-unidad-info" data-v-118d37b5><strong d b5></span><div data-v-118d37b5><strong data-v-118d37b5>NUNCA trabajar con energía</strong><p data-v-118d37b5>Siempre desconectar la alimentación antes de manipular cualquier circuito eléctrico. Verificar ausencia de voltaje con multímetro.</p></div></div><div class="ref-seg-item ref-seg-peligro" data-v-118d37b5><span class="ref-seg-icono ref-seg-dot dot-rojo" data-v-118d37b5></span><div data-v-118d37b5><strong data-v-118d37b5>No tocar con manos húmedas</strong><p data-v-118d37b5>El agua reduce la resistencia del cuerpo humano y aumenta el riesgo de electrocutación severa.</p></div></div><div class="ref-seg-item ref-seg-peligro" data-v-118d37b5><span class="ref-seg-icono ref-seg-dot dot-rojo" data-v-118d37b5></span><div data-v-118d37b5><strong data-v-118d37b5>Respetar los colores de cables</strong><p data-v-118d37b5>Fase (marrón/negro/rojo) = peligro. Neutro (azul) = retorno. Tierra (verde-amarillo) = protección.</p></div></div><div class="ref-seg-item ref-seg-advertencia" data-v-118d37b5><span class="ref-seg-icono ref-seg-dot dot-amarillo" data-v-118d37b5></span><div data-v-118d37b5><strong data-v-118d37b5>Usar EPP (Equipo de Protección Personal)</strong><p data-v-118d37b5>Guantes dieléctricos, zapatos de seguridad, lentes de protección. Nunca usar joyería metálica.</p></div></div><div class="ref-seg-item ref-seg-advertencia" data-v-118d37b5><span class="ref-seg-icono ref-seg-dot dot-amarillo" data-v-118d37b5></span><div data-v-118d37b5><strong data-v-118d37b5>Herramientas aisladas</strong><p data-v-118d37b5>Usar herramientas con mangos aislados (hasta 1000V). Verificar que no tengan grietas ni daños.</p></div></div><div class="ref-seg-item ref-seg-advertencia" data-v-118d37b5><span class="ref-seg-icono ref-seg-dot dot-amarillo" data-v-118d37b5></span><div data-v-118d37b5><strong data-v-118d37b5>Señalizar zonas de trabajo</strong><p data-v-118d37b5>Colocar carteles de &quot;PELIGRO - SE ESTÁ TRABAJANDO&quot; antes de intervenir un circuito.</p></div></div><div class="ref-seg-item ref-seg-info" data-v-118d37b5><span class="ref-seg-icono ref-seg-dot dot-azul" data-v-118d37b5></span><div data-v-118d37b5><strong data-v-118d37b5>Verificar antes de actuar</strong><p data-v-118d37b5>Medir voltaje en el punto de trabajo antes de tocar. Confirmar que el circuito está desenergizado.</p></div></div><div class="ref-seg-item ref-seg-info" data-v-118d37b5><span class="ref-seg-icono ref-seg-dot dot-azul" data-v-118d37b5></span><div data-v-118d37b5><strong data-v-118d37b5>Conocer la ruta de emergencia</strong><p data-v-118d37b5>Saber dónde está el interruptor general para cortar energía en caso de emergencia.</p></div></div></div>`,1)]),L(`div`,kb,[L(`h4`,Ab,[L(`span`,jb,[R(o,{nombre:`bolt`})]),t[296]||=z(` Peligros Eléctricos`,-1)]),t[297]||=B(`<div class="ref-grid-peligros" data-v-118d37b5><div class="ref-peligro-card ref-peligro-alto" data-v-118d37b5><h5 data-v-118d37b5>Electrocución</h5><p data-v-118d37b5>Contacto directo con partes activas bajo tensión. Puede causar fibrilación cardíaca y muerte.</p><span class="ref-peligro-nivel" data-v-118d37b5>Nivel: CRÍTICO</span></div><div class="ref-peligro-card ref-peligro-alto" data-v-118d37b5><h5 data-v-118d37b5>Arco Eléctrico</h5><p data-v-118d37b5>Descarga eléctrica entre conductores. Genera temperaturas superiores a 20,000°C.</p><span class="ref-peligro-nivel" data-v-118d37b5>Nivel: CRÍTICO</span></div><div class="ref-peligro-card ref-peligro-medio" data-v-118d37b5><h5 data-v-118d37b5>Quemaduras</h5><p data-v-118d37b5>Contacto con componentes calientes o chispas. Daño en tejidos de la piel.</p><span class="ref-peligro-nivel" data-v-118d37b5>Nivel: ALTO</span></div><div class="ref-peligro-card ref-peligro-medio" data-v-118d37b5><h5 data-v-118d37b5>Caidas</h5><p data-v-118d37b5>Reacción involuntaria ante una descarga. Caídas desde altura o contra objetos.</p><span class="ref-peligro-nivel" data-v-118d37b5>Nivel: ALTO</span></div><div class="ref-peligro-card ref-peligro-bajo" data-v-118d37b5><h5 data-v-118d37b5>Incendios Eléctricos</h5><p data-v-118d37b5>Sobrecarga de conductores, conexiones flojas o cortocircuitos. Causa #1 de incendios.</p><span class="ref-peligro-nivel" data-v-118d37b5>Nivel: MEDIO</span></div><div class="ref-peligro-card ref-peligro-bajo" data-v-118d37b5><h5 data-v-118d37b5>Daño a Equipos</h5><p data-v-118d37b5>Sobretensiones, polaridad inversa o cortocircuitos destruyen dispositivos electrónicos.</p><span class="ref-peligro-nivel" data-v-118d37b5>Nivel: MEDIO</span></div></div>`,1)]),t[298]||=B(`<div class="ref-categoria" data-v-118d37b5><h4 class="ref-cat-title" data-v-118d37b5>📋 Procedimientos de Seguridad (LOTO)</h4><div class="ref-seguridad-lista" data-v-118d37b5><div class="ref-seg-item ref-seg-procedimiento" data-v-118d37b5><span class="ref-seg-numero" data-v-118d37b5>1</span><div data-v-118d37b5><strong data-v-118d37b5>Notificar</strong><p data-v-118d37b5>Informar a todo el personal que se realizará un bloqueo/etiquetado del circuito.</p></div></div><div class="ref-seg-item ref-seg-procedimiento" data-v-118d37b5><span class="ref-seg-numero" data-v-118d37b5>2</span><div data-v-118d37b5><strong data-v-118d37b5>Apagar</strong><p data-v-118d37b5>Desconectar el interruptor o breaker que alimenta el circuito a trabajar.</p></div></div><div class="ref-seg-item ref-seg-procedimiento" data-v-118d37b5><span class="ref-seg-numero" data-v-118d37b5>3</span><div data-v-118d37b5><strong data-v-118d37b5>Bloquear</strong><p data-v-118d37b5>Colocar candado o dispositivo de bloqueo en el interruptor para que nadie lo encienda.</p></div></div><div class="ref-seg-item ref-seg-procedimiento" data-v-118d37b5><span class="ref-seg-numero" data-v-118d37b5>4</span><div data-v-118d37b5><strong data-v-118d37b5>Etiquetar</strong><p data-v-118d37b5>Colocar etiqueta con nombre, fecha y motivo del bloqueo.</p></div></div><div class="ref-seg-item ref-seg-procedimiento" data-v-118d37b5><span class="ref-seg-numero" data-v-118d37b5>5</span><div data-v-118d37b5><strong data-v-118d37b5>Verificar</strong><p data-v-118d37b5>Medir con multímetro para confirmar ausencia de voltaje. No confiar solo en el interruptor.</p></div></div><div class="ref-seg-item ref-seg-procedimiento" data-v-118d37b5><span class="ref-seg-numero" data-v-118d37b5>6</span><div data-v-118d37b5><strong data-v-118d37b5>Trabajar seguro</strong><p data-v-118d37b5>Realizar la intervención sabiendo que el circuito está desenergizado y bloqueado.</p></div></div></div></div><div class="ref-categoria" data-v-118d37b5><h4 class="ref-cat-title" data-v-118d37b5>🩺 Primeros Auxilios en Emergencias Eléctricas</h4><div class="ref-seguridad-lista" data-v-118d37b5><div class="ref-seg-item ref-seg-emergencia" data-v-118d37b5><span class="ref-seg-icono" data-v-118d37b5>🏥</span><div data-v-118d37b5><strong data-v-118d37b5>NO tocar a la víctima si aún está en contacto con la corriente</strong><p data-v-118d37b5>Cortar la energía primero o usar material aislante (madera seca, plástico) para separar a la persona.</p></div></div><div class="ref-seg-item ref-seg-emergencia" data-v-118d37b5><span class="ref-seg-icono" data-v-118d37b5>🏥</span><div data-v-118d37b5><strong data-v-118d37b5>Llamar al servicio de emergencias inmediatamente</strong><p data-v-118d37b5>Número: 911. Indicar que es accidente eléctrico. No mover a la víctima si hay sospecha de lesión espinal.</p></div></div><div class="ref-seg-item ref-seg-emergencia" data-v-118d37b5><span class="ref-seg-icono" data-v-118d37b5>🏥</span><div data-v-118d37b5><strong data-v-118d37b5>Reanimación Cardiopulmonar (RCP)</strong><p data-v-118d37b5>Si la víctima no respira y no tiene pulso, iniciar RCP inmediatamente hasta que llegue ayuda profesional.</p></div></div><div class="ref-seg-item ref-seg-emergencia" data-v-118d37b5><span class="ref-seg-icono" data-v-118d37b5>🏥</span><div data-v-118d37b5><strong data-v-118d37b5>Cubrir quemaduras</strong><p data-v-118d37b5>No aplicar cremas, pasta dental o hielo. Cubrir con vend estéril y buscar a
